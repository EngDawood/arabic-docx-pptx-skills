name: Notify dawood-claude-skills
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the sync
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DAWOOD_SKILLS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/EngDawood/dawood-claude-skills/dispatches \
            -d '{"event_type":"sync-arabic-docx-pptx"}'
